name: Publish BCIP Images

on:
  workflow_run:
    workflows:
      - BCIP CI
    types:
      - completed

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-bcip-images
  cancel-in-progress: false

jobs:
  publish:
    name: Build ${{ matrix.target }} Multi-Arch Image

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - target: web
            dockerfile: infrastructure/docker/web.Dockerfile

          - target: ai
            dockerfile: infrastructure/docker/ai.Dockerfile

          - target: migrate
            dockerfile: infrastructure/docker/migrate.Dockerfile

    steps:
      - name: Checkout successful commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Prepare image information
        id: vars
        shell: bash
        run: |
          REPOSITORY="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${REPOSITORY}-${{ matrix.target }}"
          SHA="${{ github.event.workflow_run.head_sha }}"

          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

          echo "Image: ${IMAGE}"
          echo "Commit: ${SHA}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}

          platforms: linux/amd64,linux/arm64

          push: true

          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha }}
            ${{ steps.vars.outputs.image }}:main
            ${{ steps.vars.outputs.image }}:latest

          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.vars.outputs.sha }}

          cache-from: type=gha,scope=bcip-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=bcip-${{ matrix.target }}

  deploy:
    name: Deploy exact release to DGX

    needs:
      - publish

    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - dgx-prod

    environment:
      name: production

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Deployment information
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail

          echo "========================================"
          echo "BCIP Production Deployment"
          echo "========================================"
          echo "Release:      ${RELEASE_SHA}"
          echo "Runner host:  $(hostname)"
          echo "Architecture: $(uname -m)"
          echo "User:         $(whoami)"
          echo "Time:         $(date -Iseconds)"

      - name: Synchronize deployment files
        shell: bash
        run: |
          set -Eeuo pipefail

          DEPLOY_DIR="/home/binus/lecturers/idabagus/hermes-lab/projects/bcip-prod"

          mkdir -p \
            "${DEPLOY_DIR}/infrastructure/docker/postgres-init"

          cp compose.prod.yaml \
            "${DEPLOY_DIR}/compose.prod.yaml"

          cp -a \
            infrastructure/docker/postgres-init/. \
            "${DEPLOY_DIR}/infrastructure/docker/postgres-init/"

          echo "Deployment configuration synchronized."

      - name: Prepare release
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail

          DEPLOY_DIR="/home/binus/lecturers/idabagus/hermes-lab/projects/bcip-prod"

          cd "${DEPLOY_DIR}"

          cat > .release.env.next <<EOF
          BCIP_WEB_IMAGE=ghcr.io/bagzcode/bcip-web:${RELEASE_SHA}
          BCIP_AI_IMAGE=ghcr.io/bagzcode/bcip-ai:${RELEASE_SHA}
          BCIP_MIGRATE_IMAGE=ghcr.io/bagzcode/bcip-migrate:${RELEASE_SHA}
          EOF

          chmod 600 .release.env.next

          echo "Release ${RELEASE_SHA} prepared."

          echo
          echo "Resolved production images:"

          docker compose \
            --env-file .env \
            --env-file .release.env.next \
            -f compose.prod.yaml \
            config --images

      - name: Pull exact release
        shell: bash
        run: |
          set -Eeuo pipefail

          cd /home/binus/lecturers/idabagus/hermes-lab/projects/bcip-prod

          docker compose \
            --env-file .env \
            --env-file .release.env.next \
            -f compose.prod.yaml \
            pull

      - name: Run database migrations
        shell: bash
        run: |
          set -Eeuo pipefail

          cd /home/binus/lecturers/idabagus/hermes-lab/projects/bcip-prod

          docker compose \
            --env-file .env \
            --env-file .release.env.next \
            -f compose.prod.yaml \
            run --rm migrate

      - name: Ensure MinIO buckets
        shell: bash
        run: |
          set -Eeuo pipefail

          cd /home/binus/lecturers/idabagus/hermes-lab/projects/bcip-prod

          docker compose \
            --env-file .env \
            --env-file .release.env.next \
            -f compose.prod.yaml \
            run --rm object-init

      - name: Deploy release
        shell: bash
        run: |
          set -Eeuo pipefail

          cd /home/binus/lecturers/idabagus/hermes-lab/projects/bcip-prod

          docker compose \
            --env-file .env \
            --env-file .release.env.next \
            -f compose.prod.yaml \
            up -d \
            --remove-orphans

      - name: Verify production health
        id: health
        shell: bash
        run: |
          set -Eeuo pipefail

          cd /home/binus/lecturers/idabagus/hermes-lab/projects/bcip-prod

          echo "Waiting for BCIP..."

          for attempt in $(seq 1 36); do

            if curl -fsS \
              http://127.0.0.1:3001/api/health \
              >/dev/null; then

              echo
              echo "BCIP is healthy."

              docker compose \
                --env-file .env \
                --env-file .release.env.next \
                -f compose.prod.yaml \
                ps

              exit 0
            fi

            echo "Health attempt ${attempt}/36..."
            sleep 5
          done

          echo
          echo "BCIP failed production health check."
          exit 1

      - name: Commit successful release
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail

          cd /home/binus/lecturers/idabagus/hermes-lab/projects/bcip-prod

          if [ -f .release.env ]; then
            cp .release.env .release.env.previous
            chmod 600 .release.env.previous
          fi

          mv .release.env.next .release.env
          chmod 600 .release.env

          printf '%s\n' "${RELEASE_SHA}" > .release-sha

          echo "Production release committed:"
          echo "${RELEASE_SHA}"

      - name: Show diagnostics on failure
        if: failure()
        shell: bash
        run: |
          cd /home/binus/lecturers/idabagus/hermes-lab/projects/bcip-prod

          echo "===== CONTAINERS ====="

          docker compose \
            --env-file .env \
            --env-file .release.env.next \
            -f compose.prod.yaml \
            ps || true

          echo
          echo "===== WEB LOGS ====="

          docker compose \
            --env-file .env \
            --env-file .release.env.next \
            -f compose.prod.yaml \
            logs --tail=150 web || true

          echo
          echo "===== AI API LOGS ====="

          docker compose \
            --env-file .env \
            --env-file .release.env.next \
            -f compose.prod.yaml \
            logs --tail=150 ai-api || true

          echo
          echo "===== AI WORKER LOGS ====="

          docker compose \
            --env-file .env \
            --env-file .release.env.next \
            -f compose.prod.yaml \
            logs --tail=150 ai-worker || true

  deploy:
    name: Deploy to DGX

    needs:
      - publish

    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - dgx-prod

    environment:
      name: production

    steps:
      - name: Deployment information
        shell: bash
        run: |
          echo "========================================"
          echo "BCIP Production Deployment"
          echo "========================================"
          echo "Commit: ${{ github.event.workflow_run.head_sha }}"
          echo "Runner: $(hostname)"
          echo "Architecture: $(uname -m)"
          echo "Date: $(date -Iseconds)"

      - name: Deploy BCIP
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail

          DEPLOY_DIR="/home/binus/lecturers/idabagus/hermes-lab/projects/bcip-prod"

          cd "$DEPLOY_DIR"

          echo "========================================"
          echo "Pulling production images"
          echo "========================================"

          docker compose \
            --env-file .env \
            -f compose.prod.yaml \
            pull

          echo "========================================"
          echo "Running database migrations"
          echo "========================================"

          docker compose \
            --env-file .env \
            -f compose.prod.yaml \
            run --rm migrate

          echo "========================================"
          echo "Ensuring MinIO buckets"
          echo "========================================"

          docker compose \
            --env-file .env \
            -f compose.prod.yaml \
            run --rm object-init

          echo "========================================"
          echo "Starting BCIP"
          echo "========================================"

          docker compose \
            --env-file .env \
            -f compose.prod.yaml \
            up -d \
            --remove-orphans

          echo "========================================"
          echo "Waiting for BCIP health check"
          echo "========================================"

          for attempt in $(seq 1 36); do

            if curl -fsS \
              http://127.0.0.1:3001/api/health \
              >/dev/null; then

              echo
              echo "BCIP deployment successful."
              echo "Release: ${RELEASE_SHA}"

              docker compose \
                --env-file .env \
                -f compose.prod.yaml \
                ps

              exit 0
            fi

            echo "Attempt ${attempt}/36: waiting..."
            sleep 5
          done

          echo
          echo "ERROR: BCIP failed health check."

          echo
          echo "===== CONTAINERS ====="

          docker compose \
            --env-file .env \
            -f compose.prod.yaml \
            ps

          echo
          echo "===== WEB LOGS ====="

          docker compose \
            --env-file .env \
            -f compose.prod.yaml \
            logs --tail=100 web || true

          echo
          echo "===== AI API LOGS ====="

          docker compose \
            --env-file .env \
            -f compose.prod.yaml \
            logs --tail=100 ai-api || true

          echo
          echo "===== AI WORKER LOGS ====="

          docker compose \
            --env-file .env \
            -f compose.prod.yaml \
            logs --tail=100 ai-worker || true

          exit 1
