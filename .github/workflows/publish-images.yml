name: Publish BCIP Images

on:
  workflow_run:
    workflows:
      - BCIP CI
    types:
      - completed

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-bcip-images
  cancel-in-progress: false

jobs:
  publish:
    name: Build ${{ matrix.target }} Multi-Arch Image

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - target: web
            dockerfile: infrastructure/docker/web.Dockerfile

          - target: ai
            dockerfile: infrastructure/docker/ai.Dockerfile

          - target: migrate
            dockerfile: infrastructure/docker/migrate.Dockerfile

    steps:
      - name: Checkout successful commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Prepare image information
        id: vars
        shell: bash
        run: |
          REPOSITORY="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${REPOSITORY}-${{ matrix.target }}"
          SHA="${{ github.event.workflow_run.head_sha }}"

          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

          echo "Image: ${IMAGE}"
          echo "Commit: ${SHA}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}

          platforms: linux/amd64,linux/arm64

          push: true

          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha }}
            ${{ steps.vars.outputs.image }}:main
            ${{ steps.vars.outputs.image }}:latest

          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.vars.outputs.sha }}

          cache-from: type=gha,scope=bcip-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=bcip-${{ matrix.target }}
