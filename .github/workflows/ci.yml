name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: bcip
          POSTGRES_USER: bcip
          POSTGRES_PASSWORD: change-me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bcip -d bcip"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://bcip:change-me@localhost:5432/bcip
      REDIS_URL: redis://localhost:6379/0
      BETTER_AUTH_SECRET: 0123456789abcdef0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      AI_SERVICE_URL: http://localhost:8000
      AI_SERVICE_TOKEN: replace-me
      S3_ACCESS_KEY: change-me
      S3_SECRET_KEY: change-me-change-me
      APP_URL: http://localhost:3000
      CELERY_TASK_ALWAYS_EAGER: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: |
          python -m pip install -U pip
          pip install -e "services/ai[dev]"

      - name: Format check
        run: pnpm format:check

      - name: Generate migrations if missing
        run: pnpm db:generate

      - name: Migrate database
        run: pnpm db:migrate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (JS)
        run: pnpm test

      - name: Python tests
        run: pytest services/ai/tests

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm --filter @bcip/e2e exec playwright install --with-deps chromium

      - name: Playwright smoke
        run: pnpm test:e2e
