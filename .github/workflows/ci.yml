name: BCIP CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Test and Build
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test

      # Safe CI placeholders.
      # These are NOT production credentials.
      APP_URL: http://localhost:3000

      POSTGRES_DB: bcip
      POSTGRES_USER: bcip
      POSTGRES_PASSWORD: ci-only-password
      DATABASE_URL: postgresql://bcip:ci-only-password@localhost:5433/bcip

      REDIS_URL: redis://localhost:6379/0

      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET_PRIVATE: bcip-private
      S3_BUCKET_PUBLIC: bcip-public
      S3_ACCESS_KEY: ci-access-key
      S3_SECRET_KEY: ci-secret-key
      S3_FORCE_PATH_STYLE: 'true'

      BETTER_AUTH_SECRET: ci-only-secret-012345678901234567890123456789
      BETTER_AUTH_URL: http://localhost:3000

      AI_SERVICE_URL: http://localhost:8000
      AI_SERVICE_TOKEN: ci-only-token
      AI_PROVIDER: mock

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/ai/pyproject.toml

      - name: Show tool versions
        run: |
          node --version
          pnpm --version
          python --version
          pip --version

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install AI dependencies
        run: python -m pip install -e "./services/ai[dev]"

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
