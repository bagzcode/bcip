name: bcip

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bcip}
      POSTGRES_USER: ${POSTGRES_USER:-bcip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      # Host 5433 avoids clashing with a local Postgres on 5432; matches .env.example DATABASE_URL.
      - '5433:5432'
    volumes:
      # PG 18+ images expect the mount at /var/lib/postgresql (not .../data).
      # See https://github.com/docker-library/postgres/pull/1259
      - postgres_data:/var/lib/postgresql
      - ./infrastructure/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - bcip_net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-bcip} -d ${POSTGRES_DB:-bcip}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.2-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - bcip_net
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  object-storage:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-change-me}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-change-me-change-me}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - object_data:/data
    networks:
      - bcip_net
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: '3000'
      APP_URL: ${APP_URL:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://bcip:change-me@postgres:5432/bcip}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-0123456789abcdef0123456789abcdef}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-api:8000}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-replace-me}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://object-storage:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE:-bcip-private}
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC:-bcip-public}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-change-me}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me-change-me}
      S3_FORCE_PATH_STYLE: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-api:
        condition: service_healthy
    ports:
      - '3000:3000'
    networks:
      - bcip_net
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3000/api/health',(r)=>{let d='';r.on('data',c=>d+=c);r.on('end',()=>process.exit(r.statusCode===200?0:1))}).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  ai-api:
    build:
      context: .
      dockerfile: infrastructure/docker/ai.Dockerfile
    command: ['uvicorn', 'bcip_ai.main:app', '--host', '0.0.0.0', '--port', '8000']
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DATABASE_URL: ${DATABASE_URL:-postgresql://bcip:change-me@postgres:5432/bcip}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-replace-me}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://object-storage:9000}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - '8000:8000'
    networks:
      - bcip_net
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  ai-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/ai.Dockerfile
    command: ['celery', '-A', 'bcip_ai.worker.app', 'worker', '--loglevel=INFO']
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DATABASE_URL: ${DATABASE_URL:-postgresql://bcip:change-me@postgres:5432/bcip}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-replace-me}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://object-storage:9000}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ai-api:
        condition: service_started
    networks:
      - bcip_net

  mailpit:
    profiles: ['mail']
    image: axllent/mailpit:v1.27.0
    ports:
      - '8025:8025'
      - '1025:1025'
    networks:
      - bcip_net

volumes:
  postgres_data:
  redis_data:
  object_data:

networks:
  bcip_net:
    driver: bridge
